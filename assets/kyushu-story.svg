    @keyframes float{50%{transform:translateY(-6px)}}@keyframes steam{50%{transform:translateY(-5px);opacity:.5}}@keyframes ride{50%{transform:translateY(-3px) rotate(-1deg)}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
